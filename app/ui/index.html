<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glowtray</title>
<style>
:root{
  --bg:#1c1c1e; --card:rgba(255,255,255,.05); --card-b:rgba(255,255,255,.08); --card-h:rgba(255,255,255,.085);
  --text:#f2f2f2; --muted:#9a9a9f; --faint:rgba(255,255,255,.35); --track:rgba(255,255,255,.12);
  --seg:rgba(255,255,255,.12); --input:rgba(255,255,255,.06); --input-b:rgba(255,255,255,.1);
  --accent:#ffb44c; --lc:#ffb44c; --on-accent:#1a1a1a; --danger:#ff6b6b; --ok:#3ddc84; color-scheme:dark;
}
body.light{
  --bg:#f3f3f5; --card:#ffffff; --card-b:rgba(0,0,0,.07); --card-h:#fafafa;
  --text:#1b1b1f; --muted:#6b6b72; --faint:rgba(0,0,0,.35); --track:rgba(0,0,0,.1);
  --seg:#ffffff; --input:#f6f6f8; --input-b:rgba(0,0,0,.1); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.panel{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.panel.enter{animation:enter .22s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateY(14px);opacity:.0}to{transform:none;opacity:1}}
.glow{position:absolute;left:-60px;right:-60px;top:-150px;height:300px;pointer-events:none;
  background:radial-gradient(closest-side,var(--lc),transparent);opacity:.32;transition:opacity .6s,background .6s}
body.off .glow{opacity:.06}
body.light .glow{opacity:.22}

/* header */
header{position:relative;display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.bulb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--card-b);flex:none;transition:box-shadow .5s}
body:not(.off) .bulb{box-shadow:0 0 24px -4px var(--lc)}
.bulb svg{width:24px;height:24px}
.htitle{flex:1;min-width:0}
#devName{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#8a8a8f;flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--danger)}
.dot.busy{background:#f5c542;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{width:32px;height:32px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--card-h);color:var(--text)}
.icon-btn.on{color:var(--accent)}
.icon-btn svg{width:17px;height:17px}

/* switch */
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--track);border:1px solid var(--input-b);transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+span{background:var(--accent);border-color:transparent}
.switch input:checked+span:after{left:21px;background:var(--on-accent);width:14px}
.switch.big{width:52px;height:30px}
.switch.big span:after{width:20px;height:20px;left:4px;top:4px}
.switch.big input:checked+span{background:var(--lc)}
.switch.big input:checked+span:after{left:26px;width:20px;background:var(--on-accent)}

/* tabs */
.tabs{position:relative;display:flex;margin:2px 16px 10px;padding:3px;border-radius:11px;background:var(--card);border:1px solid var(--card-b)}
.tabs button{flex:1;position:relative;z-index:1;border:0;background:none;padding:6px 0;border-radius:8px;color:var(--muted);font-weight:600}
.tabs button.active{color:var(--text)}
.tabs .ind{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--seg);transition:left .25s cubic-bezier(.2,.8,.2,1),width .25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
main{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px}
main::-webkit-scrollbar{width:6px} main::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.tab{display:none} .tab.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.row-head>span{font-weight:600}
.row-head b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;font-size:12px}
.banner{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);
  display:flex;gap:10px;align-items:center;font-size:12px}
.banner[hidden]{display:none}
.banner div{flex:1}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--fill,var(--lc)) 0 var(--p,50%),var(--track) var(--p,50%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-6px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.05);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input.ct::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ff8d21,#ffb46b,#ffe4c4,#fff7ef,#e6eeff,#c9dbff)}
input.hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,red,#ff0,lime,cyan,blue,#f0f,red)}
.bri-row{display:flex;align-items:center;gap:10px}
.bri-row svg{width:16px;height:16px;color:var(--muted);flex:none}

/* segment */
.seg{display:flex;padding:3px;border-radius:10px;background:var(--input);border:1px solid var(--input-b);margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:5px 0;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px}
.seg button.active{background:var(--seg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button:disabled{opacity:.35;cursor:default}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--input-b);background:var(--input);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--card-h)}
.chip.active{background:var(--lc);color:var(--on-accent);border-color:transparent}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* color wheel */
.wheel-wrap{position:relative;width:190px;height:190px;margin:2px auto 12px;touch-action:none}
#wheel{width:190px;height:190px;border-radius:50%;cursor:crosshair;display:block;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.knob{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
.swatches{display:flex;justify-content:space-between;gap:4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw:hover{transform:scale(1.12)}
.sw.sel{border-color:var(--text)}

/* scenes */
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scene{position:relative;border:1px solid var(--input-b);background:var(--input);border-radius:12px;padding:10px 6px 8px;text-align:center;font-size:12px;font-weight:600}
.scene:hover{background:var(--card-h)}
.scene .sc{width:26px;height:26px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 12px -2px var(--c)}
.scene small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.scene .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:12px;line-height:20px;padding:0;display:none}
.scenes.editing .scene .x{display:block}
.scenes.editing .scene{animation:wob .3s}
@keyframes wob{50%{transform:scale(.96)}}
.scene.add{border-style:dashed;color:var(--muted)}
.scene input{width:100%;border:0;background:transparent;text-align:center;outline:none;font-weight:600}

/* timer */
.timer-big{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center;margin:4px 0 0}
.timer-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--input-b);background:var(--input);padding:6px 12px;border-radius:9px;font-weight:600;font-size:12px}
.btn:hover{background:var(--card-h)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;padding:9px}
.btn:disabled{opacity:.5;cursor:default}

/* form */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.field+.field{border-top:1px solid var(--card-b)}
.field label{color:var(--text)}
.field .hint{display:block;color:var(--muted);font-size:11px}
input[type=text],input[type=number],input[type=time],select{background:var(--input);border:1px solid var(--input-b);border-radius:8px;padding:5px 8px;outline:none;min-width:0}
input[type=text]:focus,input[type=number]:focus,input[type=time]:focus,select:focus{border-color:var(--accent)}
select option{background:var(--bg);color:var(--text)}
input[type=number]{width:72px}
.w100{width:100%}
.days{display:flex;gap:4px}
.days button{width:30px;height:28px;border-radius:8px;border:1px solid var(--input-b);background:var(--input);font-size:11px;font-weight:600;color:var(--muted);padding:0}
.days button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.hk{width:150px;text-align:center;cursor:pointer;caret-color:transparent}
.hk.capturing{border-color:var(--accent);color:var(--accent)}

/* automation */
.rule{display:flex;align-items:center;gap:10px;cursor:pointer}
.rule .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--input);flex:none;color:var(--accent)}
.rule .ri svg{width:18px;height:18px}
.rule .rt{flex:1;min-width:0}
.rule .rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule .rt span{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.rule.disabled .ri{color:var(--muted)}
.sect{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:14px 2px 6px}
.cond{position:relative;padding-right:34px}
.cond .rm{position:absolute;top:10px;right:8px}
.stack>*+*{margin-top:8px}
.edhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.edhead input{flex:1;font-weight:600;font-size:14px;padding:7px 10px}
.act{display:flex;gap:8px;font-size:12px;padding:5px 0}
.act+.act{border-top:1px solid var(--card-b)}
.act time{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:8px 0;font-size:12px}
.devrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:8px}
.devrow+.devrow{border-top:1px solid var(--card-b)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);
  padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;transition:.25s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.disabled-box{opacity:.4;pointer-events:none}

/* f.lux / screen */
.mode-title{display:flex;align-items:center;gap:8px}
.mode-title .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--input);font-size:15px;flex:none}
.kpill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:700;color:#1a1a1a;margin-left:4px;vertical-align:1px}
.subopts{margin-top:8px;padding-top:4px;border-top:1px solid var(--card-b)}
.subopts .lbl{font-size:12px;color:var(--muted);padding-top:6px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:10px 10px 9px}
.tile small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.tile b{display:block;font-size:17px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{display:block;color:var(--muted);font-size:11px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .bar{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--lc);opacity:.85;min-height:2px;transition:height .4s}
.bars .bar.zero{background:var(--track);opacity:1}
.bars .bc.today .bar{opacity:1;box-shadow:0 0 10px -2px var(--lc)}
.bars .bl{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.bars.dense{gap:2px}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.heat i{height:22px;border-radius:3px;background:var(--lc)}
.heat-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.toprow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.toprow span{flex:none;width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow .tb{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.toprow .tb i{display:block;height:100%;background:var(--lc);border-radius:99px}
.toprow b{width:28px;text-align:right;color:var(--muted);font-weight:600}
</style>
</head>
<body class="off">
<div class="panel" id="panel">
  <div class="glow"></div>
  <header>
    <div class="bulb"><svg viewBox="0 0 24 24"><path id="bulbPath" fill="var(--faint)" d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2z"/><path fill="var(--muted)" d="M9 19.5h6v1a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5z"/></svg></div>
    <div class="htitle">
      <div id="devName">Glowtray</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
    </div>
    <button class="icon-btn" id="pinBtn" title="Keep panel open"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3a1 1 0 0 1 .7 1.7l-.7.7v4.2l2.7 2.7A1 1 0 0 1 18 14h-5v6l-1 2-1-2v-6H6a1 1 0 0 1-.7-1.7L8 9.6V5.4l-.7-.7A1 1 0 0 1 8 3z"/></svg></button>
    <label class="switch big" title="On / Off"><input type="checkbox" id="power"><span></span></label>
  </header>
  <div class="banner" id="banner" hidden><div id="bannerText"></div><button class="btn" id="retryBtn">Retry</button></div>
  <nav class="tabs" id="tabs">
    <span class="ind"></span>
    <button data-tab="light" class="active">Light</button>
    <button data-tab="auto">Automation</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="main">
    <!-- LIGHT -->
    <section class="tab active" id="tab-light">
      <div class="card">
        <div class="row-head"><span>Brightness</span><b id="briVal">–</b></div>
        <div class="bri-row">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>
          <input type="range" id="bri" min="1" max="100" value="50">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M4.6 19.4 6 18M18 6l1.4-1.4"/></g></svg>
        </div>
      </div>
      <div class="card">
        <div class="seg" id="modeSeg"><button data-mode="ct" class="active">White</button><button data-mode="xy">Color</button></div>
        <div id="ctBox">
          <div class="row-head"><span>Color temperature</span><b id="ctVal">–</b></div>
          <input type="range" class="ct" id="ct" min="2200" max="6500" step="50" value="2700">
          <div class="chips" id="ctChips" style="margin-top:8px"></div>
        </div>
        <div id="xyBox" hidden>
          <div class="wheel-wrap" id="wheelWrap"><canvas id="wheel" width="380" height="380"></canvas><div class="knob" id="knob"></div></div>
          <div class="swatches" id="swatches"></div>
        </div>
      </div>
      <div class="card" id="fluxCard">
        <div class="field" style="padding:0">
          <div class="mode-title"><div class="mi">🌙</div><div><label>f.lux sync</label><span class="hint" id="fluxHint">–</span></div></div>
          <label class="switch"><input type="checkbox" id="fluxOn"><span></span></label>
        </div>
        <div id="fluxOpts" class="subopts" hidden></div>
      </div>
      <div class="card">
        <div class="row-head"><span>Scenes</span><button class="link" id="sceneEditBtn">Edit</button></div>
        <div class="scenes" id="scenes"></div>
      </div>
      <div class="card" id="timerCard"></div>
      <div class="card">
        <div class="row-head"><span>Effects</span><button class="link" id="effStop" hidden>Stop</button></div>
        <div class="chips" id="effects"></div>
        <div id="screenOpts" class="subopts" hidden></div>
      </div>
    </section>

    <!-- AUTOMATION -->
    <section class="tab" id="tab-auto">
      <div id="ruleList"></div>
      <div id="ruleEditor" hidden></div>
    </section>

    <!-- STATS -->
    <section class="tab" id="tab-stats"><div id="statsBox"><div class="empty">Loading…</div></div></section>

    <!-- SETTINGS -->
    <section class="tab" id="tab-settings">
      <div class="sect" style="margin-top:0">Device</div>
      <div class="card">
        <div class="field"><div><label id="sDevName">–</label><span class="hint" id="sDevAddr">–</span></div>
          <button class="btn" id="reconnectBtn">Reconnect</button></div>
        <div class="field"><label>Display name</label><input type="text" id="sName" style="width:160px"></div>
        <div class="field" style="display:block">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><label>Add / change bulb</label><span class="hint">The bulb must be paired with Windows</span></div>
            <button class="btn" id="scanBtn">Search</button>
          </div>
          <div id="scanResults"></div>
        </div>
      </div>

      <div class="sect">Connection</div>
      <div class="card">
        <div class="seg" id="connSeg" style="margin-bottom:6px"><button data-v="share">Share with phone</button><button data-v="keep">Always connected</button></div>
        <div class="small muted" id="connHint"></div>
        <div class="field" id="idleField"><div><label>Idle timeout</label><span class="hint">How long to wait before releasing the connection</span></div>
          <div><input type="number" id="idleSec" min="3" max="600"> s</div></div>
      </div>

      <div class="sect">Hotkeys</div>
      <div class="card" id="hotkeys"></div>

      <div class="sect">Location (for sunrise / sunset)</div>
      <div class="card">
        <div class="field"><label>City</label><select id="city"></select></div>
        <div class="field"><label>Latitude / Longitude</label><div><input type="number" step="0.0001" id="lat" style="width:84px"> <input type="number" step="0.0001" id="lon" style="width:84px"></div></div>
        <div class="field"><label>Today</label><span class="muted" id="sunInfo">–</span></div>
      </div>

      <div class="sect">General</div>
      <div class="card">
        <div class="field"><div><label>Start with Windows</label><span class="hint">Starts quietly in the tray at login</span></div>
          <label class="switch"><input type="checkbox" id="autostart"><span></span></label></div>
        <div class="field"><label>Theme</label>
          <select id="theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></div>
      </div>
      <div class="btnrow" style="justify-content:space-between;margin-top:4px">
        <button class="btn" id="logBtn">Log folder</button>
        <span class="muted small" id="version"></span>

const wheel = $("#wheel"), knob = $("#knob");

/* ---------- stats ---------- */

}

    el("div", { class: "tile" }, el("small", {}, "Today"), el("b", {}, dur(d.today.on)), el("span", {}, d.today.avg_bri ? `avg. ${d.today.avg_bri}%` : "—")),
    el("div", { class: "tile" }, el("small", {}, "Last 7 days"), el("b", {}, dur(d.week.on)), el("span", {}, `turned on ${d.week.ons}×`)),
    el("div", { class: "tile" }, el("small", {}, "30-day energy"), el("b", {}, kwh(d.month.wh)), el("span", {}, cost ? "cost " + cost.slice(3) : `${d.watts} W bulb`))));

    [[7, "7 days"], [30, "30 days"]].map(([n, l]) => el("button", { class: statsRange === n ? "active" : "", onclick: () => { statsRange = n; renderStats(); } }, l)));
  const bars = el("div", { class: "bars" + (statsRange === 30 ? " dense" : "") });
  ser.forEach((x, i) => bars.append(el("div", { class: "bc" + (i === ser.length - 1 ? " today" : ""), title: `${x.date}: ${dur(x.on)}` },
    el("div", { class: "bar" + (x.on ? "" : " zero"), style: `height:${Math.max(2, x.on / max * 88)}px` }),
    el("div", { class: "bl" }, statsRange === 30 ? (i % 5 === 4 || i === ser.length - 1 ? x.label : "\u00a0") : x.label))));
  box.append(el("div", { class: "card" }, el("div", { class: "row-head" }, el("span", {}, "Time on"), seg), bars));

  // hour-of-day distribution

    el("div", { class: "row-head" }, el("span", {}, "Hours of the day"), el("b", {}, d.month.on ? `peak ${String(peak).padStart(2, "0")}:00` : "")),
    heat, el("div", { class: "heat-l" }, ...["00", "06", "12", "18", "24"].map(t => el("span", {}, t)))));

/* ---------- timer ---------- */
const TIMER_ACTIONS = { off: "Turn off", sleep: "Dim slowly and turn off", on: "Turn on", toggle: "Toggle" };

  "Rome": [41.9028, 12.4964], "São Paulo": [-23.5505, -46.6333], "Seoul": [37.5665, 126.978], "Singapore": [1.3521, 103.8198],
  "Stockholm": [59.3293, 18.0686], "Sydney": [-33.8688, 151.2093], "Tokyo": [35.6762, 139.6503], "Toronto": [43.6532, -79.3832],
  "Vienna": [48.2082, 16.3738], "Warsaw": [52.2297, 21.0122],
};
async function saveSettings(patch, msg = "Saved") {
  const r = await api().settings(patch);
  CFG = r.config; INFO.hotkeyErrors = r.hotkeyErrors; INFO.autostart = r.autostart;
  renderSettings(); applyTheme(); toast(msg);
}
function renderSettings() {
  $("#devName").textContent = CFG.device.name || (CFG.device.address ? "Hue bulb" : "Glowtray");
  $("#sDevName").textContent = CFG.device.name || "–";
  $("#sDevAddr").textContent = CFG.device.address || "No bulb selected";
  if (document.activeElement !== $("#sName")) $("#sName").value = CFG.device.name || "";
  document.querySelectorAll("#connSeg button").forEach(b => b.classList.toggle("active", b.dataset.v === CFG.connection.mode));
  $("#connHint").textContent = CFG.connection.mode === "share"
    ? "The connection is released after each command, so the Hue app on your phone can still be used."
    : "The PC stays connected to the bulb: instant response, but your phone can't connect meanwhile.";
  $("#idleField").hidden = CFG.connection.mode !== "share";
  if (document.activeElement !== $("#idleSec")) $("#idleSec").value = CFG.connection.idle_seconds;

  const hk = $("#hotkeys"); hk.innerHTML = "";
  [["toggle", "Toggle light"], ["panel", "Toggle panel"], ["bri_up", "Brightness +10"], ["bri_down", "Brightness −10"]].forEach(([k, l]) => {
    const err = (INFO.hotkeyErrors || []).includes(k);
    const inp = el("input", { type: "text", class: "hk", readonly: true, value: CFG.hotkeys[k] || "", placeholder: "None — click to assign" });
    inp.onfocus = () => { inp.classList.add("capturing"); inp.value = ""; inp.placeholder = "Press keys… (Backspace clears)"; api().hotkey_capture(true); };
    inp.onblur = () => { inp.classList.remove("capturing"); inp.value = CFG.hotkeys[k] || ""; inp.placeholder = "None — click to assign"; api().hotkey_capture(false); };
    inp.onkeydown = e => {
      e.preventDefault(); e.stopPropagation();
      if (e.key === "Escape") { inp.blur(); return; }
      if (e.key === "Backspace" || e.key === "Delete") { saveSettings({ hotkeys: { [k]: "" } }, "Hotkey removed"); inp.blur(); return; }
      const key = keyName(e.code);
      if (!key) return;
      const mods = [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Win"].filter(Boolean);
      if (!mods.length && !/^F\d+$/.test(key)) { inp.placeholder = "Use with Ctrl / Alt / Shift"; return; }
      const combo = [...mods, key].join("+");
      inp.blur();
      saveSettings({ hotkeys: { [k]: combo } }, "Hotkey: " + combo).then(() => {
        if ((INFO.hotkeyErrors || []).includes(k)) toast("This hotkey is already used by another program");
      });
    };
    hk.append(field(l, inp, err ? "⚠ Could not register (used by another program)" : null));
  });

  const city = $("#city");
  if (!city.options.length) {
    Object.keys(CITIES).forEach(c => city.append(el("option", { value: c }, c)));
    city.append(el("option", { value: "Custom" }, "Custom location"));
  }
  city.value = CITIES[CFG.location.city] ? CFG.location.city : "Custom";
  if (document.activeElement !== $("#lat")) $("#lat").value = CFG.location.lat;
  if (document.activeElement !== $("#lon")) $("#lon").value = CFG.location.lon;
  $("#sunInfo").textContent = `☀ ${SUN.sunrise || "–"}   🌙 ${SUN.sunset || "–"}`;
  $("#autostart").checked = !!INFO.autostart;
  $("#theme").value = CFG.theme;
  $("#version").textContent = "v" + (INFO.version || "");
}
function keyName(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3);
  if (/^Digit\d$/.test(code)) return code.slice(5);
  if (/^F\d{1,2}$/.test(code)) return code;
  const m = { ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Space: "Space", PageUp: "PageUp", PageDown: "PageDown",
    Home: "Home", End: "End", Insert: "Insert", Pause: "Pause", Equal: "+", Minus: "-", NumpadAdd: "NumPlus", NumpadSubtract: "NumMinus", Comma: ",", Period: "." };
  return m[code] || null;
}
$("#sName").onchange = e => saveSettings({ device: { name: e.target.value.trim() } });
document.querySelectorAll("#connSeg button").forEach(b => b.onclick = () => saveSettings({ connection: { mode: b.dataset.v } }));
$("#idleSec").onchange = e => saveSettings({ connection: { idle_seconds: clamp(+e.target.value || 20, 3, 600) } });
$("#autostart").onchange = e => saveSettings({ autostart: e.target.checked }, e.target.checked ? "Will start with Windows" : "Autostart turned off");
$("#theme").onchange = e => saveSettings({ theme: e.target.value });
async function updateSun() { SUN = await api().sun(CFG.location.lat, CFG.location.lon); renderSettings(); }
$("#city").onchange = async e => {
  const c = e.target.value; if (c === "Custom") { $("#lat").focus(); return; }
  await saveSettings({ location: { city: c, lat: CITIES[c][0], lon: CITIES[c][1] } }); updateSun();
};
const saveLatLon = async () => {
  const lat = +$("#lat").value, lon = +$("#lon").value;
  if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { toast("Invalid location"); return; }
  await saveSettings({ location: { city: "Custom", lat, lon } }); updateSun();
};
$("#lat").onchange = saveLatLon; $("#lon").onchange = saveLatLon;
$("#reconnectBtn").onclick = () => { api().reconnect(); toast("Reconnecting…"); };
$("#logBtn").onclick = () => api().open_log();
$("#quitBtn").onclick = e => {
  if (e.target.dataset.sure) api().quit();
  else { e.target.dataset.sure = 1; e.target.textContent = "Are you sure?"; setTimeout(() => { delete e.target.dataset.sure; e.target.textContent = "Quit app"; }, 3000); }
};
$("#scanBtn").onclick = async () => {
  const box = $("#scanResults"), btn = $("#scanBtn");
  btn.disabled = true; box.innerHTML = ""; box.append(el("div", { class: "small muted", style: "padding:8px 0" }, el("span", { class: "spinner" }), "  Searching for nearby Hue bulbs…"));
  const r = await api().scan();
  btn.disabled = false; box.innerHTML = "";
  if (!r.ok) { box.append(el("div", { class: "small", style: "color:var(--danger);padding:6px 0" }, "Scan failed: " + r.error)); return; }
  if (!r.devices.length) {
    box.append(el("div", { class: "small muted", style: "padding:6px 0" },
      "No visible bulbs found. Bulbs connected to a phone are not visible — close the Hue app on your phone and try again. For a new bulb: Hue Bluetooth app → Settings → Voice assistants → Make lights visible."));
    return;
  }
  r.devices.forEach(d => {
    const cur = d.address.toUpperCase() === (CFG.device.address || "").toUpperCase();
    box.append(el("div", { class: "devrow" },
      el("div", {}, el("div", {}, d.name), el("span", { class: "hint" }, `${d.address} · ${d.rssi} dBm`)),
      cur ? el("span", { class: "muted small" }, "In use") :
        el("div", { class: "btnrow" },
          el("button", { class: "btn", title: "Pair with Windows (the bulb must be in visible mode)", onclick: async ev => {
            ev.target.disabled = true; ev.target.textContent = "…"; const p = await api().pair(d.address);
            ev.target.disabled = false; ev.target.textContent = "Pair"; toast(p.ok ? "Paired" : p.error);
          } }, "Pair"),
          el("button", { class: "btn primary", onclick: () => { saveSettings({ device: { address: d.address, name: d.name } }, "Bulb selected"); box.innerHTML = ""; } }, "Use"))));
  });
};

/* ---------- calls from Python ---------- */
window.hue = {
  onState(st) { S = st; renderState(); },
  onTimer(t) { TIMER = t; renderTimer(); },
  onActivity(a) { ACTIVITY = a; renderActivity(); },
  onFlux(f) { FLUX = f; renderFlux(); },
  onConfig(c) { CFG = c; renderFlux(); renderFluxOpts(); },
  onShow() { const p = $("#panel"); p.classList.remove("enter"); void p.offsetWidth; p.classList.add("enter"); requestAnimationFrame(moveInd);
    if ($("#tab-stats").classList.contains("active")) loadStats(); },
  onHide() { if (sceneEditing) { sceneEditing = false; $("#sceneEditBtn").textContent = "Edit"; renderScenes(); } },
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !e.target.classList?.contains("hk")) {
    if (ED) closeEditor(); else api().hide();
  }
});
document.addEventListener("contextmenu", e => { if (!["INPUT"].includes(e.target.tagName)) e.preventDefault(); });

async function init() {
  const d = await api().init();
  CFG = d.config; S = d.state; TIMER = d.timer; SUN = d.sun; ACTIVITY = d.activity || []; FLUX = d.flux || {};
  INFO = { version: d.version, autostart: d.autostart, systemDark: d.systemDark, hotkeyErrors: d.hotkeyErrors, frozen: d.frozen };
  $("#pinBtn").classList.toggle("on", !!d.pinned);
  applyTheme();
  renderState(); renderScenes(); renderTimer(); renderRules(); renderSettings(); renderFlux(); renderFluxOpts();
  requestAnimationFrame(moveInd);
  if (!CFG.device.address) { setTab("settings"); toast("Pick your bulb: Device → Search"); }
}
if (window.pywebview && window.pywebview.api && window.pywebview.api.init) init();
else window.addEventListener("pywebviewready", init);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { INFO.systemDark = e.matches; applyTheme(); });
</script>
