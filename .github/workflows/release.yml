name: Build release

# Push a tag like v1.2.0 to build Glowtray.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build
        run: pyinstaller glowtray.spec

      - name: Collect third-party licenses
        run: python tools/third_party_licenses.py

      # Glowtray.exe.sha256 uses the `sha256sum` format; the release notes show the hash and how to check it
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Glowtray.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/Glowtray.exe.sha256", "$hash  Glowtray.exe`n")
          $notes = @'
          **SHA-256** of `Glowtray.exe`: `HASH`

          To check your download, run this in PowerShell in the folder where you saved it. It should print `True`:

          ```powershell
          (Get-FileHash .\Glowtray.exe -Algorithm SHA256).Hash -eq 'HASH'
          ```
          '@
          [IO.File]::WriteAllText("dist/release-notes.md", $notes.Replace("HASH", $hash) + "`n")
          Get-Content dist/Glowtray.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Glowtray
          path: |
            dist/Glowtray.exe
            dist/Glowtray.exe.sha256
            THIRD_PARTY_LICENSES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Glowtray.exe
            dist/Glowtray.exe.sha256
            THIRD_PARTY_LICENSES.md
          body_path: dist/release-notes.md
          generate_release_notes: true
